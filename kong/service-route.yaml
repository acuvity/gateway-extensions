_format_version: "3.0"

services:
  - name: anthropic-service
    url: https://api.anthropic.com
    routes:
      - name: anthropic-route
        paths:
          - /anthropic
        protocols:
          - http
          - https
        strip_path: true
  - name: openai-service
    url: https://api.openai.com
    routes:
      - name: openai-route
        paths:
          - /openai
        protocols:
          - http
          - https
        strip_path: true

plugins:
  - name: acuvity-guard
    config:
      message: Blocked by policy
      timeout_ms: 60000
      apex_url: ${APEX_URL}
      acuvity_token: ${ACUVITY_TOKEN}