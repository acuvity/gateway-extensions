apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kong
  annotations:
    konghq.com/gatewayclass-unmanaged: "true"
spec:
  controllerName: konghq.com/kic-gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kong
  namespace: kong
spec:
  gatewayClassName: kong
  listeners:
    - name: proxy
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: v1
kind: Service
metadata:
  name: anthropic-upstream
  namespace: kong
  annotations:
    konghq.com/protocol: https
    konghq.com/host-header: api.anthropic.com
spec:
  type: ExternalName
  externalName: api.anthropic.com
  ports:
    - port: 443
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: exa-upstream
  namespace: kong
  annotations:
    konghq.com/protocol: https
    konghq.com/host-header: api.exa.ai
spec:
  type: ExternalName
  externalName: api.exa.ai
  ports:
    - port: 443
      protocol: TCP
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: acuvity-guard
  namespace: kong
plugin: acuvity-guard
config:
  apex_url: 
  acuvity_token: 
  provider: kong-proxy
  timeout_ms: 60000
  message: Blocked by policy
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: anthropic-route
  namespace: kong
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: acuvity-guard
spec:
  parentRefs:
    - name: kong
      namespace: kong
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /anthropic
      backendRefs:
        - name: anthropic-upstream
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: exa-route
  namespace: kong
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: acuvity-guard
spec:
  parentRefs:
    - name: kong
      namespace: kong
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /exa
      backendRefs:
        - name: exa-upstream
          port: 443
