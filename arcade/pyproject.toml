[project]
name = "arcade"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "fastapi>=0.135.3",
    "uvicorn>=0.42.0",
    "langchain-core>=1.2.21",
    "mangum>=0.21.0",
    "python-dotenv>=1.2.2",
    "PyJWT[crypto]>=2.8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F"]  # pycodestyle, pyflakes
